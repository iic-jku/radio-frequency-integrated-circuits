project:
   type: website
   # run code cells from the project root, so that decks in slides/ find the
   # same files as the notes in the root
   execute-dir: project

var:
  url-repo: https://github.com/iic-jku/radio-frequency-integrated-circuits   # to call this value : {{< meta var.url-repo >}}

website:
  title: "Radio-Frequency Integrated Circuits"
  favicon: favicon.png
  navbar:
    background: "#447099"
    search: true
    left:
      - icon: house
        href: index.qmd
        text: "About"
      - href: rfic.qmd
        text: "Course Material"
      - icon: easel
        href: slides/index.qmd
        text: "Slides"
      - icon: bi-filetype-pdf
        text: PDF
        href: rfic.pdf
    right:
      - icon: github
        href: "{{< meta var.url-repo >}}"
        target: "_blank"

  page-footer:
    right: | 
      Website built with [Quarto](https://quarto.org/){.external target="_blank"}
    left: |
      [Source code]({{< meta var.url-repo >}}){.external target="_blank"}
execute:
  freeze: auto

format:
  html:
    theme:
      light: cosmo
      dark: solar
    fig-align: center
    lang: en-US
    lightbox: true
